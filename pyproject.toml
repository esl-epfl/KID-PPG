[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kid_ppg"
version = "0.0.4"
authors = [
  { name="Christodoulos Kechris", email="christodoulos.kechris@epfl.ch" }
]
description = "A library for performing probabilistic heart rate extraction from photoplehysmography signals."
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    "tensorflow>=2.17.0",
    "tensorflow-probability>=0.24.0",
    "tf-keras>=2.17.0",
    "scipy>=1.14.1",
    "resampy>=0.4.3",
  ]
[project.optional-dependencies]
notebook = [
    "jupyter>=1.1.1",
    "matplotlib>=3.9.2",
    "silence-tensorflow>=1.2.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/esl-epfl/KID-PPG"